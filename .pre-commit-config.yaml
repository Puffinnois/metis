repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: ruff-check
        name: ruff check (python)
        entry: bash -c 'cd python && uv run ruff check .'
        language: system
        files: ^python/
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format (check, python)
        entry: bash -c 'cd python && uv run ruff format --check .'
        language: system
        files: ^python/
        types: [python]
        pass_filenames: false

      - id: prettier
        name: prettier (check, frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --check . --ignore-unknown'
        language: system
        files: ^frontend/
        pass_filenames: false
