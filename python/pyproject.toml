[project]
name = "metis-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15.0",
    "nba_api>=1.4",
    "requests>=2.32",
    "pbpstats>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-httpserver>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "ml", "cv"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "ml", "cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
