[project]
name = "metis-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15.0",
    "nba_api>=1.4",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "ml", "cv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
