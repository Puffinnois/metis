appId: com.yhabie.metis
productName: Metis
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!data/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,Plan.md,decisions.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,.nvmrc,components.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # DuckDB ships a musl build beside the glibc one on Linux; the app only loads the glibc one.
  - '!node_modules/@duckdb/node-bindings-*-musl/**'
asarUnpack:
  - resources/**
  # DuckDB's native binding and library load from disk, not from inside the asar.
  - node_modules/@duckdb/node-bindings-*/**
win:
  executableName: Metis
  # Drawn by scripts/make-icon.mjs from build/icon.svg. The NSIS installer, its uninstaller and
  # the shortcuts take the same icon.
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  # The install-mode page offers "Only for me", selected, which installs under
  # %LOCALAPPDATA%\Programs\Metis without admin rights; "Anyone who uses this computer" asks for them.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The uninstaller removes the program, its shortcuts and its registry entries, and keeps
  # %APPDATA%\Metis: the stats file takes a long load to rebuild, and deleting it is the user's call.
  deleteAppDataOnUninstall: false
  # The welcome page's independence statement.
  include: build/installer.nsh
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Puffinnois
  repo: metis
  releaseType: draft
